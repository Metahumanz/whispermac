name: Publish Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (for example v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate release version, notes, and architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "${RELEASE_TAG#v}" = "$(cat VERSION)"
          test -s "docs/releases/$RELEASE_TAG.md"
          test "$(uname -m)" = arm64
          echo "WHISPERMAC_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          swift --version
          xcodebuild -version

      - name: Run tests
        # Some UI tests share the process-wide localization state.
        run: swift test --no-parallel

      - name: Build pinned whisper.cpp runtime
        run: ./scripts/setup-whispercpp.sh

      - name: Build and verify app bundle
        run: |
          ./scripts/build-app-bundle.sh
          codesign --verify --deep --strict dist/WhisperMac.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/WhisperMac.app/Contents/Info.plist)" = "$WHISPERMAC_VERSION"
          lipo dist/WhisperMac.app/Contents/MacOS/WhisperMac -verify_arch arm64
          dist/WhisperMac.app/Contents/Resources/runtime/bin/whisper-cli --help

      - name: Create and verify distributable assets
        run: |
          ./scripts/create-release-assets.sh "$RELEASE_TAG"
          cd dist/release-assets
          shasum -a 256 -c ./*.sha256

      - name: Retain build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WhisperMac-${{ env.RELEASE_TAG }}-macos-arm64
          path: dist/release-assets/*
          if-no-files-found: error

      - name: Publish release with detailed notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/releases/$RELEASE_TAG.md"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "WhisperMac $RELEASE_TAG" --notes-file "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" dist/release-assets/*.zip dist/release-assets/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --title "WhisperMac $RELEASE_TAG" \
            --notes-file "$NOTES" --draft=false --prerelease=false --latest
